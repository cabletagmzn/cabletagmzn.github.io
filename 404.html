<style>:root{--bg:#0b0b0d;--bg2:#131317;--card:#18181d;--line:#2a2a31;--fg:#f2f2f4;--mut:#a3a3ad;--red:#e23b4a;--red2:#ff5866;--ok:#3ecf8e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
a{color:inherit}
img{max-width:100%;height:auto}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
h1,h2,h3{line-height:1.15;margin:0}

.top{position:sticky;top:0;z-index:5;background:rgba(11,11,13,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-weight:700;font-size:19px;white-space:nowrap}
.brand img{height:34px;width:auto}
.lang{position:relative}
.lang summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);font-weight:600;font-size:15px}
.lang summary::-webkit-details-marker{display:none}
.lang summary img,.lang li img{border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.lang ul{position:absolute;inset-inline-end:0;top:calc(100% + 6px);margin:0;padding:8px;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:2px;width:440px;max-width:calc(100vw - 32px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.55)}
.lang li a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;font-size:15px}
.lang li a:hover{background:#24242b}
.lang li a[aria-current]{background:rgba(226,59,74,.15);color:var(--red2);font-weight:600}
/* portada */
.hero{padding:56px 0 40px;background:radial-gradient(900px 420px at 85% 10%,rgba(226,59,74,.16),transparent 70%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:44px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,50px);letter-spacing:-.02em;font-weight:800}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--mut);margin:18px 0 28px;max-width:34em}
.dlh{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin-bottom:12px}
.dlh small{font-weight:500;letter-spacing:0;text-transform:none;margin-inline-start:6px;opacity:.7}
.dls{display:flex;flex-wrap:wrap;gap:10px}
.dl{display:inline-flex;align-items:center;gap:10px;padding:13px 20px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-decoration:none;font-weight:700;font-size:16px;transition:.15s}
.dl svg{width:20px;height:20px}
.dl:hover{border-color:#4a4a55;background:#202027}
.dl.main{background:var(--red);border-color:var(--red);color:#fff;padding:15px 26px;font-size:17px;box-shadow:0 8px 26px rgba(226,59,74,.35)}
.dl.main:hover{background:var(--red2);border-color:var(--red2)}
.alts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:16px}
.alt{display:inline-flex;align-items:center;gap:7px;color:var(--mut);font-size:15px;text-decoration:none;border-bottom:1px dashed transparent}
.alt svg{width:17px;height:17px}
.alt:hover{color:var(--fg);border-bottom-color:var(--mut)}
.note{margin:22px 0 0;font-size:14px;color:var(--ok)}
.shot{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px rgba(255,255,255,.02)}
.shot img{display:block;width:100%}
/* secciones */
section h2{font-size:clamp(24px,2.6vw,32px);margin-bottom:26px;font-weight:800;letter-spacing:-.01em}
.feats,.how,.faq{padding:56px 0}
.feats{background:var(--bg2);border-block:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card svg{width:30px;height:30px;color:var(--red2)}
.card h3{font-size:18px;margin:14px 0 8px}
.card p{margin:0;color:var(--mut);font-size:15px}
.how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.how li{display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:20px}
.how b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;font-size:16px}
.faq .wrap{max-width:860px}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-bottom:10px}
.faq summary{cursor:pointer;padding:16px 20px;font-weight:650;font-size:17px;list-style:none;position:relative;padding-inline-end:46px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;inset-inline-end:20px;top:12px;font-size:24px;color:var(--mut)}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0;padding:0 20px 18px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:30px 0 40px;color:var(--mut);font-size:14px}
footer .wrap{display:flex;gap:16px;align-items:flex-start}
footer p{margin:0 0 6px}
footer a{text-decoration:none}
footer a:hover{color:var(--fg)}
.langs a{white-space:nowrap}
/* página raíz (elige idioma) */
.root{display:grid;place-items:center;min-height:100vh}
.pick{text-align:center;padding:40px 20px}
.pick h1{font-size:34px;margin:14px 0 26px}
.picklist{list-style:none;padding:0;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;max-width:820px}
.picklist a{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);text-decoration:none}
.picklist a:hover{border-color:var(--red)}
@media (max-width:980px){.hero .wrap{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.how ol{grid-template-columns:1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.brand span{display:none}.dl{flex:1 1 100%;justify-content:center}.lang ul{grid-template-columns:1fr;width:240px}.hero{padding-top:32px}}
